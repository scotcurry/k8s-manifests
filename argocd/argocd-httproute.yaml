apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-http-route
  namespace: argocd
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: ingress
      sectionName: https
      kind: Gateway

  # Argo CD lives at /argocd so the front-end can have "/". No URLRewrite/strip-prefix
  # filter: argocd-server expects the full /argocd path (server.rootpath in
  # argocd-insecure-server-configmap.yaml).
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /argocd

      backendRefs:
        - name: argocd-server
          namespace: argocd
          port: 80
