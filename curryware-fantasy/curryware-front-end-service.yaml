apiVersion: v1
kind: Service
metadata:
  labels:
    app: curryware-front-end
  name: curryware-front-end
spec:
  ports:
  - port: 80
    protocol: TCP
    # The Next.js standalone server listens on 3000 (PORT in the image).
    targetPort: 3000
  selector:
    app: curryware-front-end
  type: ClusterIP
