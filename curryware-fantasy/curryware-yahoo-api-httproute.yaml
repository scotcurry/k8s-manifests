apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: yahoo-https-route
  namespace: curryware
spec:
  parentRefs:
    - name: traefik
      sectionName: https
      kind: Gateway

  hostnames:
    - ubuntu-microk8s.curryware.org

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /cw_api
      filters:
      - type: ExtensionRef
        extensionRef:
          group: traefik.io
          kind: Middleware
          name: strip-cwapi-java-prefix

      backendRefs:
        - name: curryware-yahoo-api
          namespace: curryware
          port: 8087
