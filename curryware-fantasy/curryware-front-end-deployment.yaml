apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: curryware-front-end
    tags.datadoghq.com/env: "prod"
    tags.datadoghq.com/service: "curryware-front-end"
    tags.datadoghq.com/version: "67"
  name: curryware-front-end
spec:
  replicas: 1
  selector:
    matchLabels:
      app: curryware-front-end
  template:
    metadata:
      labels:
        app: curryware-front-end
        tags.datadoghq.com/env: "prod"
        tags.datadoghq.com/service: "curryware-front-end"
        tags.datadoghq.com/version: "67"
      annotations:
        admission.datadoghq.com/js-lib.version: v6.27.0
    spec:
      containers:
        - name: curryware-front-end
          image: scotcurry4/curryware-front-end:67
          ports:
            - containerPort: 3000
          env:
          # Server-side only: pages call the Java API over the cluster network.
          - name: JAVA_API_BASE_URL
            value: "http://curryware-java-api-server-service:8080"
          - name: DD_PROFILING_ENABLED
            value: "true"
          - name: DD_APPSEC_ENABLED
            value: "true"
          - name: DD_LOGS_INJECTION
            value: "true"
          - name: DD_RUNTIME_METRICS_ENABLED
            value: "true"
          - name: DD_GIT_REPOSITORY_URL
            value: "github.com/scotcurry/curryware-front-end"
          - name: DD_DYNAMIC_INSTRUMENTATION_ENABLED
            value: "true"
