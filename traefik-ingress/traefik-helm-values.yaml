# Helm values for the Traefik ingress controller (release "traefik" in namespace "ingress").
#
# Traefik was installed by `microk8s enable` as the upstream chart traefik/traefik 39.0.8
# (https://traefik.github.io/charts). Argo CD does NOT manage this file; apply changes with:
#
#   helm upgrade traefik traefik --repo https://traefik.github.io/charts --version 39.0.8 \
#     -n ingress -f traefik-ingress/traefik-helm-values.yaml
#
# Make every Traefik change here rather than with `kubectl edit`: Helm overwrites hand edits
# to the DaemonSet on the next upgrade. The DaemonSet uses hostPorts 80/443 on a single node,
# so a rollout only starts after the old pod is deleted (a few seconds of downtime):
#   kubectl delete pod -n ingress -l app.kubernetes.io/name=traefik

# ---- Values set by the MicroK8s addon at install time (unchanged) ----
deployment:
  kind: DaemonSet
extraObjects:
  - apiVersion: networking.k8s.io/v1
    kind: IngressClass
    metadata:
      annotations:
        ingressclass.kubernetes.io/is-default-class: "true"
      name: public
    spec:
      controller: traefik.io/ingress-controller
  - apiVersion: networking.k8s.io/v1
    kind: IngressClass
    metadata:
      name: nginx
    spec:
      controller: traefik.io/ingress-controller
gateway:
  listeners:
    web:
      namespacePolicy:
        from: All
ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik
ingressRoute:
  dashboard:
    enabled: true
    entryPoints:
      - web
    matchRule: Host(`dashboard.localhost`)
providers:
  kubernetesGateway:
    enabled: true
  kubernetesIngress:
    allowEmptyServices: true
    enabled: true
    publishedService:
      enabled: true
  kubernetesIngressNginx:
    enabled: true

ports:
  web:
    exposedPort: 80
    hostPort: 80
    port: 8000
    protocol: TCP
    # ---- Added 2026-11-25 (previously a kubectl edit of the DaemonSet) ----
    # Redirect all HTTP to HTTPS. The chart renders `to` as the target port's exposedPort
    # (:443). The old hand edit used `to=websecure`, which redirected to the internal
    # port :8443 and broke both plain-HTTP visits and Let's Encrypt HTTP-01 renewals.
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    exposedPort: 443
    hostPort: 443
    port: 8443
    protocol: TCP

# ---- Added 2026-11-25 (previously a kubectl edit of the DaemonSet) ----
# JSON logs and access logs, for Datadog log parsing.
logs:
  general:
    format: json   # JSON has no color codes, so the old --log.noColor flag is not needed
  access:
    enabled: true
    format: json
