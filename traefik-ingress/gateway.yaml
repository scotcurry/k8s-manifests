apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: traefik-gateway
  namespace: ingress
  annotations:
    # cert-manager creates the ubuntu-microk8s-tls Certificate from this annotation.
    # To debug HTTP-01 validation without production rate limits, switch it to
    # letsencrypt-staging (cert-issuer-staging.yaml); staging certs are NOT
    # browser-trusted, so switch back as soon as a staging issuance succeeds.
    cert-manager.io/issuer: letsencrypt-production
spec:
  gatewayClassName: traefik

  listeners:
    - name: http
      protocol: HTTP
      port: 8000  # Has to match the container port described in the daemonset description.
      hostname: "ubuntu-microk8s.curryware.org"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              shared-gateway-access: "true"

    - name: https
      protocol: HTTPS
      port: 8443 # Has to match the container port described in the daemonset description.
      hostname: "ubuntu-microk8s.curryware.org"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              shared-gateway-access: "true"
      tls:
        mode: Terminate
        certificateRefs:
          - name: ubuntu-microk8s-tls
            namespace: ingress
